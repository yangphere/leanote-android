name: Android

on:
  pull_request:
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_CMDLINE_TOOLS: "16111833"
  ANDROID_PLATFORM: "37.0"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  verify-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS }}
          packages: "platform-tools platforms/android-${{ env.ANDROID_PLATFORM }} build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
      - name: Record toolchain
        shell: bash
        run: |
          grep -Fx 'Pkg.Revision=23.0' "$ANDROID_SDK_ROOT/cmdline-tools/${ANDROID_CMDLINE_TOOLS}/source.properties"
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_PLATFORM}"
          test -x "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          java -version
          ./gradlew --version
          printf 'JAVA_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT"
          sdkmanager --list_installed
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-configuration-cache
      - name: Test, lint, and build debug APK
        shell: bash
        run: |
          ./gradlew testDebugUnitTest --no-configuration-cache
          ./gradlew lintDebug --no-configuration-cache
          ./gradlew assembleDebug --configuration-cache
          ./gradlew assembleDebug --configuration-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release-apk:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS }}
          packages: "platform-tools platforms/android-${{ env.ANDROID_PLATFORM }} build-tools/${{ env.ANDROID_BUILD_TOOLS }}"
      - name: Verify fixed Android SDK packages
        shell: bash
        run: |
          grep -Fx 'Pkg.Revision=23.0' "$ANDROID_SDK_ROOT/cmdline-tools/${ANDROID_CMDLINE_TOOLS}/source.properties"
          test -d "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_PLATFORM}"
          test -x "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
      - name: Build and inspect signed APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PWD }}
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PWD }}
          BUGLY_PRD: ${{ secrets.BUGLY_PRD }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 KEY_ALIAS KEY_PWD KEYSTORE_PWD; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required production signing input: ${required}" >&2
              exit 1
            fi
          done
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/leanote-release.jks"
          cleanup() { rm -f -- "$RELEASE_KEYSTORE_PATH"; }
          trap cleanup EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          java -version
          ./gradlew --version
          ./gradlew assembleRelease --no-configuration-cache

          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -c -P 16 -v 4 "$apk"
          "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "$apk" | tee app-release-badging.txt
          "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump xmltree "$apk" AndroidManifest.xml | tee app-release-manifest.txt
          if grep -Eq 'REQUEST_INSTALL_PACKAGES|com\.tencent\.bugly\.beta' app-release-manifest.txt; then
            echo 'Forbidden install permission or Bugly upgrade component found' >&2
            exit 1
          fi

          mapfile -t libraries < <(unzip -Z1 "$apk" | grep -E '\.so$' || true)
          printf '%s\n' "${libraries[@]}" | sed '/^$/d' | tee app-release-native-libraries.txt
          native_dir="$RUNNER_TEMP/leanote-native-libraries"
          mkdir -p "$native_dir"
          for library in "${libraries[@]}"; do
            target="$native_dir/${library//\//_}"
            unzip -p "$apk" "$library" > "$target"
            mapfile -t alignments < <(readelf -lW "$target" | awk '$1 == "LOAD" { print $NF }')
            if (( ${#alignments[@]} == 0 )); then
              echo "No ELF PT_LOAD segments found: $library" >&2
              exit 1
            fi
            for alignment in "${alignments[@]}"; do
              if (( alignment < 0x4000 )); then
                echo "ELF PT_LOAD alignment below 16 KB: $library ($alignment)" >&2
                exit 1
              fi
            done
          done
          sha256sum "$apk" | tee app-release.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
            app-release-badging.txt
            app-release-manifest.txt
            app-release-native-libraries.txt
          if-no-files-found: error
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Android APK release"
          gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk app-release.apk.sha256
